# crates/archiver-core/Cargo.toml
[package]
name = "archiver-core"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }  # miniz_oxide, pure Rust
crc32fast = "1.4"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[lints]
workspace = true
